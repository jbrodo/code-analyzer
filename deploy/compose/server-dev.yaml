# Ambiente di sviluppo del server (I-05). ADR-0016, ADR-0018, ADR-0019, ADR-0030.
# Solo loopback, nessun TLS, dati in volumi locali: non e' un'installazione e non va esposto.
# Nessun segreto nel repository: la password del database viene dall'ambiente.
#
#   deploy/docker/server/build-dev-image.sh
#   export CA_DEV_DB_PASSWORD="$(openssl rand -hex 16)"
#   docker compose -f deploy/compose/server-dev.yaml up -d --wait
#   curl -s http://127.0.0.1:8000/v1/health
#   docker compose -f deploy/compose/server-dev.yaml down --volumes
#
# Porte: CA_API_PORT (default 8000) e CA_DB_PORT (default 55432, per non scontrarsi con un PostgreSQL locale), sempre su 127.0.0.1.
#
# Ancora assenti, per mancanza dei task che le usano:
#  - IdP finto: arriva con B-04 (ADR-0019), da un emittente di prova in processo o da un servizio
#    la cui licenza e manutenzione si verificano allora.
#  - SPA: la serve l'immagine di rilascio (I-03); in sviluppo si usa `bun run --cwd web dev`.
#  - Collegamento dell'API al database: arriva con B-02. Il servizio parte gia' con il database
#    in attesa, cosi' B-02 non cambia questo file.
name: ca-server-dev

services:
  db:
    # PostgreSQL 16 (§2), fissato per digest (indice OCI letto in locale il 2026-11-17).
    image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    ports:
      - "127.0.0.1:${CA_DB_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: code_analyzer
      POSTGRES_USER: ca
      POSTGRES_PASSWORD: ${CA_DEV_DB_PASSWORD:?imposta CA_DEV_DB_PASSWORD, per esempio con openssl rand -hex 16}
    volumes:
      - db-data:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ca -d code_analyzer"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    # Costruita da deploy/docker/server/build-dev-image.sh: non si scarica da nessun registry.
    image: ca-server-dev:local
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CA_API_PORT:-8000}:8000"
    environment:
      CA_API_ARTIFACT_ROOT: /var/lib/ca/artifacts
    volumes:
      - artifacts:/var/lib/ca/artifacts
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
  artifacts:
