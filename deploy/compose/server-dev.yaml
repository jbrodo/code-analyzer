# Ambiente di sviluppo del server (I-05). ADR-0016, ADR-0018, ADR-0019, ADR-0030.
# Solo loopback, nessun TLS, dati in volumi locali: non e' un'installazione e non va esposto.
# Nessun segreto nel repository: la password del database viene dall'ambiente.
#
#   deploy/docker/server/build-dev-image.sh
#   export CA_DEV_DB_PASSWORD="$(openssl rand -hex 16)"
#   docker compose -f deploy/compose/server-dev.yaml up -d --wait
#   curl -s http://127.0.0.1:8000/v1/health
#   CA_UPLOAD_ALLOW_LOOPBACK_HTTP=1 uv run python deploy/compose/seed_dev.py   # dati di prova
#   docker compose -f deploy/compose/server-dev.yaml down --volumes
#
# Porte: CA_API_PORT (default 8000) e CA_DB_PORT (default 55432, per non scontrarsi con un PostgreSQL locale), sempre su 127.0.0.1.
#
# L'IdP finto (`idp`, deploy/docker/dev-idp/idp.py) rilascia a chiunque raggiunga la porta un token
# con i gruppi richiesti: serve solo qui, su loopback. Le sue chiavi nascono a ogni avvio.
# Sta nella rete dell'API (`network_mode`) perche' il verificatore ammette `http` solo su loopback.
#   curl -s -X POST "http://127.0.0.1:9000/user/token?sub=ada&groups=admins,approvers"
#   curl -s -X POST "http://127.0.0.1:9000/github/token?repository=acme/shop&repository_id=9001"
# Il tenant `dev` lo crea il servizio `migrate`, che applica anche le migrazioni.
# La SPA e' nell'immagine di sviluppo: dopo `up`, aprire http://127.0.0.1:8000 (l'IdP finto va lasciato
# sulla porta 9000, quella di web/public/config.json). Con le modifiche alla SPA: `bun run --cwd web dev`.

name: ca-server-dev

services:
  db:
    # PostgreSQL 16 (§2), fissato per digest (indice OCI letto in locale il 2026-11-17).
    image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    ports:
      - "127.0.0.1:${CA_DB_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: code_analyzer
      POSTGRES_USER: ca
      POSTGRES_PASSWORD: ${CA_DEV_DB_PASSWORD:?imposta CA_DEV_DB_PASSWORD, per esempio con openssl rand -hex 16}
    volumes:
      - db-data:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ca -d code_analyzer"]
      interval: 2s
      timeout: 2s
      retries: 30

  idp:
    # Stessa immagine dell'API (PyJWT e cryptography ci sono gia'): nessuna dipendenza in piu'.
    image: ca-server-dev:local
    pull_policy: never
    entrypoint: ["python", "/idp/idp.py"]
    # Nella rete dell'API: il verificatore ammette `http` solo verso loopback, e per l'API l'IdP
    # e' 127.0.0.1:9000. La porta verso l'host e' dichiarata sull'API.
    network_mode: "service:api"
    depends_on:
      api:
        condition: service_started
    environment:
      ISSUER_BASE: http://127.0.0.1:9000
    volumes:
      - ../docker/dev-idp:/idp:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: ca-server-dev:local
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "python -m ca_api.manage migrate && python -m ca_api.manage create-tenant dev"]
    environment:
      CA_API_DATABASE_URL: postgresql+pg8000://ca:${CA_DEV_DB_PASSWORD}@db:5432/code_analyzer
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    # Costruita da deploy/docker/server/build-dev-image.sh: non si scarica da nessun registry.
    image: ca-server-dev:local
    pull_policy: never
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CA_API_PORT:-8000}:8000"
      - "127.0.0.1:${CA_IDP_PORT:-9000}:9000"  # IdP finto (servizio `idp`, stessa rete)
    environment:
      CA_API_ARTIFACTS_DIR: /var/lib/ca/artifacts
      CA_API_DATABASE_URL: postgresql+pg8000://ca:${CA_DEV_DB_PASSWORD}@db:5432/code_analyzer
      CA_API_AUTH_FILE: /etc/ca/auth.json
      # la SPA parla con l'IdP finto: l'origine che la CSP deve ammettere (porta 9000, come web/public/config.json)
      CA_API_CSP_CONNECT: http://127.0.0.1:${CA_IDP_PORT:-9000}
    volumes:
      - artifacts:/var/lib/ca/artifacts
      - ./dev-auth.json:/etc/ca/auth.json:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
  artifacts:
