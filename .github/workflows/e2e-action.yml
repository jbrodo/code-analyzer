# N-05: l'Action gira nella CI del progetto. Nel job si avvia il registry locale, si costruiscono e
# firmano i plugin con una chiave generata al momento, si costruisce l'immagine CLI e l'Action
# la usa da lì. Nessun segreto e nessuna immagine esce dal job (D2-16).
#
# Il repository analizzato è il progetto stesso. Un push su main conserva il report come artefatto
# `code-analyzer-baseline`; una PR lo trova (o analizza il base) e confronta. I passi finali
# verificano su GitHub il commento e la check run. Il SARIF richiede Code Scanning attivo: la
# verifica è un avviso, non un errore.
name: e2e-action

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: e2e-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: write
      checks: write
    env:
      CA_REGISTRY_PORT: "5055"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - uses: ./.github/actions/e2e-tools

      - name: Registry locale, plugin firmati e immagine CLI
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/ca-keys"
          mkdir -m 700 "$keys"
          docker compose -f deploy/compose/registry.yaml up -d --wait
          CA_KEY_DIR="$keys" deploy/docker/package-cli.sh "$RUNNER_TEMP/ca-package"
          deploy/docker/cli/build-cli-image.sh "$RUNNER_TEMP/ca-package" \
            localhost/ca-action-e2e:latest "$RUNNER_TEMP/ca-cli-sbom"
          echo "CA_PUBLIC_KEY=$keys/cosign.pub" >> "$GITHUB_ENV"

      - name: Code Analyzer
        id: analyze
        uses: ./integrations/github-action
        with:
          image: localhost/ca-action-e2e:latest
          public-key: ${{ env.CA_PUBLIC_KEY }}
          fail-on: critico,alto
          network: host

      # Anche se il gate ha fallito: il commento e la check run vanno verificati comunque.
      - name: Verifica commento e check run su GitHub
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          comments=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- code-analyzer:1 -->"))] | length' | awk '{s+=$1} END {print s+0}')
          [ "$comments" = 1 ] || { echo "::error::attesi 1 commento di Code Analyzer, trovati $comments"; exit 1; }
          checks=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "Code Analyzer")] | length')
          [ "$checks" -ge 1 ] || { echo "::error::nessuna check run di Code Analyzer sul commit di testa"; exit 1; }
          gh api "repos/$REPO/code-scanning/analyses?per_page=1" --jq 'length' > /dev/null \
            || echo "::warning::SARIF non verificabile: Code Scanning non attivo o permesso mancante"

      - name: Ferma il registry
        if: always()
        run: docker compose -f deploy/compose/registry.yaml down -v
