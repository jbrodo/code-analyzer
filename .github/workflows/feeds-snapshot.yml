# O-03: scarica i feed con il prodotto, li congela e li salva come cache della CI. Unico job che
# raggiunge i feed. Un nuovo snapshot si salva solo se T-08 resta verde (tests/fixtures/feeds).
name: feeds-snapshot

on:
  schedule:
    # Lunedì e giovedì. GitHub cancella una cache non usata da 7 giorni: con un solo snapshot
    # alla settimana un'esecuzione saltata la svuota, e l'e2e fallisce per mancanza dei feed.
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: feeds-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CA_TEST_DOCKER: "1"
      CA_REGISTRY_PORT: "5055"
      CA_TEST_OSV_FEEDS: /home/runner/work/code-analyzer/feeds-snapshot
      CA_TEST_TRIVY_FEEDS: /home/runner/work/code-analyzer/feeds-snapshot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - uses: ./.github/actions/e2e-tools

      - name: Installa le dipendenze
        run: uv sync --frozen

      - name: Costruisci il pacchetto con registry locale e chiave di prova
        env:
          CA_KEY_DIR: ${{ runner.temp }}/keys
        run: |
          docker compose -f deploy/compose/registry.yaml up -d --wait
          deploy/docker/package-cli.sh "$RUNNER_TEMP/package"

      - name: Sincronizza i feed con il prodotto
        env:
          CA_COSIGN_PUBLIC_KEY: ${{ runner.temp }}/package/cosign.pub
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg
        run: |
          mkdir "$RUNNER_TEMP/tiny"
          echo 'print(1)' > "$RUNNER_TEMP/tiny/a.py"
          "$RUNNER_TEMP/package/venv/bin/code-analyzer" scan "$RUNNER_TEMP/tiny" \
            --format json --output-dir "$RUNNER_TEMP/tiny-out" > /dev/null

      # I file della cache appartengono all'utente del container dei plugin.
      - name: Congela lo snapshot
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/xdg"
          chmod -R u+rwX "$RUNNER_TEMP/xdg"
          uv run --frozen --offline python tests/fixtures/feeds/snapshot.py freeze \
            --from-cache "$RUNNER_TEMP/xdg/code-analyzer/feeds" --dest "$CA_TEST_OSV_FEEDS"

      - name: Rilevamento dei CVE con il nuovo snapshot (T-08)
        run: uv run --frozen --offline pytest -q --no-cov tests/e2e/test_detection_cve.py

      - name: Salva lo snapshot
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CA_TEST_OSV_FEEDS }}
          key: feeds-snapshot-${{ github.run_id }}

  # Un'esecuzione programmata fallita apre (o aggiorna) un'issue: senza, un fallimento si vede solo
  # nell'elenco delle Actions, e la cache dei feed scade in silenzio dopo 7 giorni. Non copre i job
  # che non partono affatto (limiti di spesa): per quelli servono le notifiche di GitHub.
  report-failure:
    needs: snapshot
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: "CI: feeds-snapshot programmato fallito"
    steps:
      - name: Apri o aggiorna l'issue
        run: |
          set -euo pipefail
          body="Esecuzione fallita: $RUN_URL. Senza uno snapshot nuovo entro 7 giorni la cache dei feed scade e l'e2e fallisce."
          number=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi
