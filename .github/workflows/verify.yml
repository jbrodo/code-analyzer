# O-01: verifica su ogni PR. Esegue i comandi di AGENTS.md (§16).
# Verifica Python e web su ogni PR.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      # Installa le dipendenze Python dal lock.
      - name: Installa le dipendenze
        run: uv sync --frozen

      # I controlli Python non richiedono rete.
      - name: ruff check
        run: uv run --frozen --offline ruff check .

      - name: ruff format
        run: uv run --frozen --offline ruff format --check .

      - name: ty check
        run: uv run --frozen --offline ty check packages --error-on-warning

      - name: pytest
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-sentinel
        run: uv run --frozen --offline pytest -q

      # O-03: come in e2e.yml, nessuna prova scarica i feed nella cache predefinita.
      - name: Nessun feed scaricato dalle prove
        if: always()
        run: test ! -e "$RUNNER_TEMP/xdg-sentinel/code-analyzer/feeds"

      - name: lint-imports
        run: uv run --frozen --offline lint-imports

      - name: schema_export --check
        run: uv run --frozen --offline python -m ca_core.schema_export --check
      - name: openapi_export --check
        run: uv run --frozen --offline python -m ca_api.openapi_export --check

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Installa le dipendenze web
        run: bun install --cwd web --frozen-lockfile

      - name: lint web
        run: bun run --cwd web lint

      - name: test web
        run: bun run --cwd web test

  # O-04: i test di integrazione del server su PostgreSQL 16 vero (testcontainers) con l'archivio su
  # file system e, per l'adattatore S3, il server di prova in container. Nessun servizio esterno e
  # nessun segreto: le immagini si scaricano dal registry pubblico solo per avviare i contenitori.
  server-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CA_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Installa le dipendenze
        run: uv sync --frozen

      - name: Test di integrazione di ca-api
        run: uv run --frozen --offline pytest -q --no-cov tests/integration/test_api_database.py tests/integration/test_api_ingest.py tests/integration/test_api_reads.py tests/integration/test_api_openapi_conformance.py tests/integration/test_api_s3_store.py
