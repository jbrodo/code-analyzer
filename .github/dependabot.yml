# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  # Dependabot gestisce package.json e bun.lock con l'ecosistema bun.
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 è il compilatore nativo e non ha l'API JavaScript di cui hanno bisogno
      # typescript-eslint (peer dichiarato fino alla 6.0) e openapi-typescript (W-02). Da riprendere
      # quando entrambi lo supportano.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
