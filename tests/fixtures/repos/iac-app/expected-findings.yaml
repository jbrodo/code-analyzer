# Attesi della fixture F-02 della Fase 2. Formato: ../../expected-findings.schema.json
# Ogni voce e' stata osservata il 2026-11-16 eseguendo lo strumento sulla fixture:
#   checkov 3.4.5: checkov -f <file> ... --skip-download --framework dockerfile kubernetes terraform
#   hadolint 2.15.1: hadolint --disable-ignore-pragma -f json Dockerfile
#   trivy 0.76.2: trivy config --format json
# `correlation` nomina il problema: le voci con lo stesso valore sullo stesso file sono lo stesso
# problema visto da strumenti diversi, e devono finire nello stesso gruppo (ADR-0026, K-21).
# Gli strumenti riportano molto altro su questi tre file (34 controlli checkov, 36 trivy):
# qui stanno solo i problemi messi di proposito.
# Righe: checkov riporta l'intervallo dell'intera risorsa; trivy non da' una riga a DS-0002 e DS-0026.
