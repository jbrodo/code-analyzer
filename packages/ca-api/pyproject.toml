[project]
name = "ca-api"
version = "0.0.0"
description = "Server di Code Analyzer: riceve i report della CLI e li serve all'API e alla UI"
license = "GPL-3.0-only"
requires-python = ">=3.14"
# Versioni di V-01 (2026-11-13) come punto di partenza; sqlalchemy, alembic, pg8000, pyjwt e
# opentelemetry entrano con i task che li usano (B-02, B-04, B-13), con licenza verificata.
dependencies = [
    "ca-core",
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    # Lettore di multipart/form-data di `POST /v1/scans` (ADR-0016): licenza permissiva e rilasci
    # recenti verificati il 2026-11-17 (C-08); i limiti di dimensione li applica B-03 mentre legge.
    "python-multipart>=0.0.34,<1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
ca-core = { workspace = true }
