[project]
name = "ca-core"
version = "0.0.0"
description = "Modello dati e normalizzazione di Code Analyzer"
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26,<5",
    "pydantic>=2.14,<3",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
