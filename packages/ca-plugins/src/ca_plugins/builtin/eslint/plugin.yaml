# Plugin eslint (P-02): qualita' del codice JS, TS e TSX in SARIF 2.1.0. ADR-0004, 0005, 0007,
# 0014, 0026. Manifest sorgente: `image` senza digest e su un registry inesistente (`.invalid`)
# perche' D-0005 e' aperta. Il digest (@sha256:...) lo inserisce il rilascio dopo build-image.sh e
# sign-local.sh.
apiVersion: code-analyzer/v1
name: eslint
version: 1.0.0
image: registry.invalid/ca-plugins/eslint:1.0.0
capabilities: [detect]
languages: [javascript, typescript]
categories: [quality]
inputs:
  workspace: readonly
  config: optional  # {"disable_rules": [...]} da `plugins.eslint.disable_rules`, ricontrollato dall'adattatore
  sbom: none
outputs:
  sarif: /out/results.sarif
  # Provvisorio, da confermare in X-04 sui pilota: un risultato pesa circa 350 byte (nessun testo
  # dei file). 32 MiB reggono circa 90 mila risultati.
  max_bytes: 33554432
resources:
  # Provvisorie fino alla misura sui pilota (X-05). Il JSON nativo di eslint porta il testo dei
  # file con messaggi e Node ha un'impronta di memoria alta: 2 GiB finche' non si misura.
  cpu: "1"
  memory: 2Gi
  timeout: 600s
  pids: 64
network: none
