# Plugin checkov (P-03): configurazioni IaC (Dockerfile, Kubernetes, Terraform) in SARIF 2.1.0.
# ADR-0004, 0005, 0007, 0014, 0026. Manifest sorgente: `image` senza digest e su un registry
# inesistente (`.invalid`) perche' D-0005 e' aperta. Il digest (@sha256:...) lo inserisce il
# rilascio dopo build-image.sh e sign-local.sh.
apiVersion: code-analyzer/v1
name: checkov
version: 1.0.0
image: registry.invalid/ca-plugins/checkov:1.0.0
capabilities: [detect]
languages: []
categories: [iac]
inputs:
  workspace: readonly
  config: optional  # {"disable_rules": [...]} da `plugins.checkov.disable_rules`, ricontrollato dall'adattatore
  sbom: none
outputs:
  sarif: /out/results.sarif
  # Misurato il 2026-11-18 (I-02): al massimo 1,2 KB sui tre pilota (pochi file di infrastruttura). 8 MiB
  # reggono oltre 25 mila risultati da circa 270 byte; scende dai 32 MiB provvisori.
  max_bytes: 8388608
resources:
  # Misurato il 2026-11-18 (I-02): 3,5 s e al massimo 213 MiB di picco sui tre pilota. 1 GiB è cinque
  # volte il picco; la copia di lavoro in /tmp (fino a 64 MiB) conta nel limite. 128 PID: con 64 il
  # gruppo di processi di checkov si blocca su una macchina con venti core (auto-analisi, 2026-11-18).
  cpu: "1"
  memory: 1Gi
  timeout: 120s
  pids: 128
network: none
