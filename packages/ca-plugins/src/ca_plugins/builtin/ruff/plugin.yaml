# Plugin ruff (P-01): qualità del codice Python in SARIF 2.1.0. ADR-0004, 0005, 0007, 0014, 0026.
# Manifest sorgente: `image` senza digest e su un registry inesistente (`.invalid`) perche' D-0005
# e' aperta. Il digest (@sha256:...) lo inserisce il rilascio dopo build-image.sh e sign-local.sh.
apiVersion: code-analyzer/v1
name: ruff
version: 1.0.0
image: registry.invalid/ca-plugins/ruff:1.0.0
capabilities: [detect]
languages: [python]
categories: [quality]
inputs:
  workspace: readonly
  config: optional  # {"disable_rules": [...]} da `plugins.ruff.disable_rules`, ricontrollato dall'adattatore
  sbom: none
outputs:
  sarif: /out/results.sarif
  # Misurato il 2026-11-18 (I-02): 1,25 MB su saleor (4.384 file Python, circa 3.500 risultati), 2,4 KB
  # su fastapi. 32 MiB, oltre venti volte il massimo; un risultato pesa circa 350 byte.
  max_bytes: 33554432
resources:
  # Misurato il 2026-11-18 (I-02) su fastapi, excalidraw e saleor: al massimo 0,9 s e 60 MiB di picco
  # su saleor. 512 MiB sono otto volte il picco, 120 s oltre cento volte il tempo.
  cpu: "1"
  memory: 512Mi
  timeout: 120s
  pids: 32
network: none
