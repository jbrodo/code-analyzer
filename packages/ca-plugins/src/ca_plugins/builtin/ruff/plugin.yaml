# Plugin ruff (P-01): qualità del codice Python in SARIF 2.1.0. ADR-0004, 0005, 0007, 0014, 0026.
# Manifest sorgente: `image` senza digest e su un registry inesistente (`.invalid`) perche' D-0005
# e' aperta. Il digest (@sha256:...) lo inserisce il rilascio dopo build-image.sh e sign-local.sh.
apiVersion: code-analyzer/v1
name: ruff
version: 1.0.0
image: registry.invalid/ca-plugins/ruff:1.0.0
capabilities: [detect]
languages: [python]
categories: [quality]
inputs:
  workspace: readonly
  config: optional  # {"disable_rules": [...]} da `plugins.ruff.disable_rules`, ricontrollato dall'adattatore
  sbom: none
outputs:
  sarif: /out/results.sarif
  # Provvisorio, da confermare in X-04 sui pilota con le misure: un risultato pesa circa 350 byte
  # (nessun testo dei file). 32 MiB reggono circa 90 mila risultati.
  max_bytes: 33554432
resources:
  # Provvisorie fino alla misura sui pilota (X-05): ruff e' un binario nativo che su saleor
  # (4.384 file) dovrebbe stare nell'ordine dei secondi.
  cpu: "1"
  memory: 1Gi
  timeout: 300s
  pids: 32
network: none
