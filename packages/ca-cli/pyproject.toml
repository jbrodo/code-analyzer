[project]
name = "ca-cli"
version = "0.0.0"
description = "Comando code-analyzer"
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = ["ca-core", "ca-plugins", "ca-graph", "pyyaml>=6"]

[project.scripts]
code-analyzer = "ca_cli.main:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
ca-core = { workspace = true }
ca-plugins = { workspace = true }
ca-graph = { workspace = true }
