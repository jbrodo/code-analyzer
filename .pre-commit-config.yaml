# Schemi esterni e fixture devono restare identici byte per byte (SHA in schemas/vendor/SOURCES.json).
exclude: ^(schemas/vendor/|tests/fixtures/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
