# Schemi esterni e fixture devono restare identici byte per byte (SHA in SOURCES.json e in
# `VENDOR_MANIFEST_SHA256`). I file stanno in ca_core/vendor_schemas; schemas/vendor è un symlink.
exclude: ^(schemas/vendor/|packages/ca-core/src/ca_core/vendor_schemas/|packages/ca-plugins/src/ca_plugins/builtin/[^/]+/(fixtures|licenses)/|tests/fixtures/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: ty-check
        name: ty check
        entry: uv run --frozen ty check packages --error-on-warning
        language: system
        types: [python]
        pass_filenames: false
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
