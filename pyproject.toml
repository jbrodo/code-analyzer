[project]
name = "code-analyzer"
version = "0.0.0"
description = "Workspace di Code Analyzer"
requires-python = ">=3.12"
dependencies = ["ca-core", "ca-plugins", "ca-cli"]

[dependency-groups]
dev = ["import-linter>=2.16", "mypy>=2.4", "pytest>=8", "pytest-cov>=7.1", "ruff>=0.17"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ca-core = { workspace = true }
ca-plugins = { workspace = true }
ca-cli = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ca_core --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".claude", "doc"]
src = ["packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

# ADR-0001: dipendenze interne solo verso ca-core.
[tool.importlinter]
root_packages = ["ca_core", "ca_plugins", "ca_cli"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dipendenze interne verso ca_core"
type = "layers"
layers = ["ca_cli", "ca_plugins", "ca_core"]

[[tool.importlinter.contracts]]
name = "ca_core senza framework, rete né processi"
type = "forbidden"
source_modules = ["ca_core"]
forbidden_modules = [
    "aiohttp",
    "asyncpg",
    "boto3",
    "botocore",
    "fastapi",
    "http",
    "httpx",
    "psycopg",
    "psycopg2",
    "requests",
    "s3fs",
    "socket",
    "sqlalchemy",
    "subprocess",
    "temporalio",
    "urllib",
    "urllib3",
]

[[tool.importlinter.contracts]]
name = "ca_cli senza server né database"
type = "forbidden"
source_modules = ["ca_cli"]
forbidden_modules = ["asyncpg", "fastapi", "psycopg", "psycopg2", "sqlalchemy", "temporalio"]
